map $request_method $content_admin_write_key {
    default "";
    POST $binary_remote_addr;
    PUT $binary_remote_addr;
    DELETE $binary_remote_addr;
}

map $request_method $content_admin_read_key {
    default "";
    GET $binary_remote_addr;
    HEAD $binary_remote_addr;
}

limit_req_zone $content_admin_write_key zone=content_admin_write:10m rate=10r/m;
limit_req_zone $content_admin_read_key zone=content_admin_read:10m rate=120r/m;

server {
    listen 443 ssl http2;
    server_name api.moqian.me;

    client_max_body_size 51m;

    location /api/auth/ {
        client_max_body_size 128k;
        proxy_pass http://127.0.0.1:8787;
        add_header Cache-Control "no-store" always;
        include proxy_params;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /api/admin/ {
        limit_req zone=content_admin_write burst=5 nodelay;
        limit_req zone=content_admin_read burst=160 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8787;
        proxy_read_timeout 150s;
        proxy_send_timeout 150s;
        proxy_request_buffering on;
        add_header Cache-Control "no-store" always;
        include proxy_params;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        add_header Cache-Control "no-store" always;
        include proxy_params;
        proxy_set_header X-Forwarded-Proto https;
    }
}
